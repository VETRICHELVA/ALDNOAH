services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel, POSTGRES_DB: sentinel }
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      JWT_SECRET: local-dev-secret-please-change-0123456789
    ports: ["8000:8000"]
    depends_on: [postgres]
volumes:
  pgdata:
